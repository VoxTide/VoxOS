# HP EliteBook 1030 G1 (Intel, HD Graphics 515)
PKG_GROUPS=(base dev apps shell print)
AUR_GROUPS=(aur-dev aur-theme)
SERVICES=(tlp.service bluetooth.service cups.socket avahi-daemon.service paccache.timer)
# TLP wymaga wyłączenia systemd-rfkill
MASK_SERVICES=(systemd-rfkill.service systemd-rfkill.socket)
ENABLE_MULTILIB=false
# btrfs + snapper z archinstalla: migawka przed i po każdej zmianie pakietów
SNAPPER=true
# Motyw przy pierwszej instalacji (dostępne: ls themes/), później przełączany przez voxos-theme
THEME=dot
# Po włączeniu od razu Hyprland z ekranem blokady motywu zamiast ekranu logowania SDDM
AUTOLOGIN=true
# Cichy start: bez menu systemd-boot i komunikatów jądra (menu: przytrzymaj Spację przy starcie)
QUIET_BOOT=true
# Hibernacja: plik wymiany na btrfs (@swap) + zamknięcie klapki = uśpienie, po 2 h hibernacja
HIBERNATE=true
