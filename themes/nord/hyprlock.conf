# VoxOS - ekran blokady (hyprlock), motyw Nord

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/voxos/current/wallpaper.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.75
}

# Godzina
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    color = rgb(ECEFF4)
    position = 0, 160
    halign = center
    valign = center
}

# Data po polsku, odświeżana co minutę
label {
    monitor =
    text = cmd[update:60000] date '+%A, %-d %B'
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgb(88C0D0)
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    rounding = 12
    outer_color = rgb(88C0D0)
    inner_color = rgba(3B4252DD)
    font_color = rgb(ECEFF4)
    check_color = rgb(EBCB8B)
    fail_color = rgb(BF616A)
    placeholder_text = <span foreground="##4C566A">Hasło</span>
    fail_text = Złe hasło
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# Użytkownik
label {
    monitor =
    text = 󰀄  $USER
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = rgb(D8DEE9)
    position = 0, -110
    halign = center
    valign = center
}
