# VoxOS - powiadomienia (mako), motyw Nord
font=JetBrainsMono Nerd Font 10
background-color=#2E3440F2
text-color=#ECEFF4
border-color=#88C0D0
progress-color=over #5E81AC
border-size=2
border-radius=10
padding=12
margin=12
width=360
icons=1
icon-path=/usr/share/icons/Papirus-Dark
max-icon-size=40
default-timeout=5000

[urgency=low]
border-color=#4C566A

[urgency=critical]
border-color=#BF616A
default-timeout=0

# Okienko OSD (głośność, jasność): na środku u góry, krótko, bez ikony
[app-name=voxos-osd]
anchor=top-center
width=300
default-timeout=1500
icons=0
# bez zapisu w historii (nie zaśmiecają listy powiadomień w panelu)
history=0

# Tryb "Nie przeszkadzać" (kafelek w panelu szybkich ustawień): powiadomienia trafiają tylko do historii
[mode=do-not-disturb]
invisible=1

# ...ale okienko OSD głośności i jasności dalej widać
[mode=do-not-disturb app-name=voxos-osd]
invisible=0
