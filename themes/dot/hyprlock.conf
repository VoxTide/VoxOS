# VoxOS - ekran blokady (hyprlock), motyw "dot"

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/voxos/current/wallpaper.jpg
    blur_passes = 0
    brightness = 0.45
}

# Godzina z kropek
label {
    monitor =
    text = $TIME
    font_size = 140
    font_family = VoxDot Bold
    color = rgb(FFFFFF)
    position = 0, 170
    halign = center
    valign = center
}

# Czerwona kropka - znak rozpoznawczy motywu
label {
    monitor =
    text = 󰝥
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgb(D71921)
    position = 0, 40
    halign = center
    valign = center
}

# Data wielkimi literami
label {
    monitor =
    text = cmd[update:60000] date '+%A · %-d %B' | awk '{ print toupper($0) }'
    font_size = 15
    font_family = Space Mono
    color = rgb(8A8A8A)
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 1
    rounding = -1
    outer_color = rgb(3A3A3A)
    inner_color = rgba(000000E6)
    font_color = rgb(EDEDED)
    check_color = rgb(EDEDED)
    fail_color = rgb(D71921)
    placeholder_text = <span font_family="Space Mono" foreground="##5A5A5A">HASŁO</span>
    fail_text = <span font_family="Space Mono">ZŁE HASŁO</span>
    dots_spacing = 0.4
    dots_size = 0.22
    fade_on_empty = false
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 12
    font_family = Space Mono
    color = rgb(5A5A5A)
    position = 0, -150
    halign = center
    valign = center
}
