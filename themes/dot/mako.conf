# VoxOS - powiadomienia (mako), motyw "dot"
font=Space Mono 10
background-color=#000000F2
text-color=#EDEDED
border-color=#2A2A2A
progress-color=over #D71921
border-size=1
border-radius=18
padding=14
margin=14
width=360
icons=1
icon-path=/usr/share/icons/Papirus-Dark
max-icon-size=40
default-timeout=5000

[urgency=low]
text-color=#8A8A8A

[urgency=critical]
border-color=#D71921
border-size=2
default-timeout=0

# Okienko OSD (głośność, jasność): na środku u góry, krótko, bez ikony
[app-name=voxos-osd]
anchor=top-center
width=300
default-timeout=1500
icons=0
# bez zapisu w historii (nie zaśmiecają listy powiadomień w panelu)
history=0

# Tryb "Nie przeszkadzać" (kafelek w panelu szybkich ustawień): powiadomienia trafiają tylko do historii
[mode=do-not-disturb]
invisible=1

# ...ale okienko OSD głośności i jasności dalej widać
[mode=do-not-disturb app-name=voxos-osd]
invisible=0
