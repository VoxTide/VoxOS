# VoxOS - główna konfiguracja Hyprlanda (wspólna dla wszystkich hostów)
# Ustawienia konkretnego sprzętu (monitory, jasność) są w host.conf
source = ~/.config/hypr/host.conf

$terminal    = kitty
$menu        = rofi -show drun
$fileManager = thunar
$mod         = SUPER

# --- Autostart ---------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = swaybg -c '#1e1e2e'
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# --- Wygląd ------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(a6e3a1ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}

decoration {
    rounding = 8
}

animations {
    enabled = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# --- Klawiatura i mysz -------------------------------------------------------
input {
    kb_layout = pl
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# --- Skróty ------------------------------------------------------------------
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, E, exec, $fileManager
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod, Space, togglefloating
bind = $mod, L, exec, hyprlock
bind = $mod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Zrzuty ekranu: Print = zaznaczenie do schowka, Shift+Print = cały ekran do pliku
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, mkdir -p "$(xdg-user-dir PICTURES)/Zrzuty" && grim "$(xdg-user-dir PICTURES)/Zrzuty/$(date +%F_%H-%M-%S).png"

# Fokus strzałkami
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Przełączanie pulpitów
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Przenoszenie okna na pulpit
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Przesuwanie i zmiana rozmiaru okien myszką
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Głośność
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
