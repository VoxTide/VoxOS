general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 1,5 min: na baterii przyciemnienie ekranu (ruch myszą przywraca jasność)
listener {
    timeout = 90
    on-timeout = bash ~/.local/bin/voxos-dim battery
    on-resume = bash ~/.local/bin/voxos-dim restore
}

# 4 min: przyciemnienie także na zasilaczu
listener {
    timeout = 240
    on-timeout = bash ~/.local/bin/voxos-dim always
    on-resume = bash ~/.local/bin/voxos-dim restore
}

# 5 min: blokada
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5,5 min: wygaszenie ekranu
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 15 min: uśpienie (z hibernacją po 2 h, jeśli jest włączona w host.conf: HIBERNATE=true)
listener {
    timeout = 900
    on-timeout = bash ~/.local/bin/voxos-suspend
}
